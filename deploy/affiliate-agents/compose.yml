name: bracketiq-affiliate-codex-agents

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-common: &common
  image: ${AFFILIATE_AGENT_IMAGE:?Set AFFILIATE_AGENT_IMAGE in deployment.env}
  user: ${AFFILIATE_AGENT_USER:-1001:1001}
  working_dir: /workspace
  restart: "${AFFILIATE_AGENT_RESTART_POLICY:-no}"
  init: true
  stop_grace_period: 2m
  networks:
    - agent
    - production_backend
  logging: *default-logging

x-mapper: &mapper
  <<: *common
  environment:
    AFFILIATE_MAPPING_LOOP_INTERVAL_SECONDS: "${AFFILIATE_MAPPING_LOOP_INTERVAL_SECONDS:-300}"
  cpus: ${AFFILIATE_MAPPER_CPU_LIMIT:-1.25}
  mem_limit: ${AFFILIATE_MAPPER_MEMORY_LIMIT:-4g}
  mem_reservation: ${AFFILIATE_MAPPER_MEMORY_RESERVATION:-768m}
  memswap_limit: ${AFFILIATE_MAPPER_MEMORY_SWAP_LIMIT:-4g}
  pids_limit: ${AFFILIATE_MAPPER_PIDS_LIMIT:-512}

x-reviewer: &reviewer
  <<: *common
  cpus: ${AFFILIATE_REVIEWER_CPU_LIMIT:-1.0}
  mem_limit: ${AFFILIATE_REVIEWER_MEMORY_LIMIT:-2g}
  mem_reservation: ${AFFILIATE_REVIEWER_MEMORY_RESERVATION:-512m}
  memswap_limit: ${AFFILIATE_REVIEWER_MEMORY_SWAP_LIMIT:-2g}
  pids_limit: ${AFFILIATE_REVIEWER_PIDS_LIMIT:-512}

x-coverage: &coverage
  <<: *common
  cpus: ${AFFILIATE_COVERAGE_CPU_LIMIT:-1.0}
  mem_limit: ${AFFILIATE_COVERAGE_MEMORY_LIMIT:-2g}
  mem_reservation: ${AFFILIATE_COVERAGE_MEMORY_RESERVATION:-512m}
  memswap_limit: ${AFFILIATE_COVERAGE_MEMORY_SWAP_LIMIT:-2g}
  pids_limit: ${AFFILIATE_COVERAGE_PIDS_LIMIT:-512}

services:
  mapper-1:
    <<: *mapper
    container_name: bracketiq-affiliate-codex-agent
    command:
      - npm
      - run
      - affiliate:intakes:codex-loop
      - --
      - --live
      - --container-isolated
      - --worker=codex-luna-vm-1
    volumes:
      - ${AFFILIATE_AGENT_ROOT:-/home/bracketiq}/.codex-affiliate-container:/home/codex/.codex
      - ${AFFILIATE_AGENT_ROOT:-/home/bracketiq}/mvp-site-codex-luna-test:/workspace
      - ${AFFILIATE_AGENT_ENV_FILE:-/home/bracketiq/.config/bracketiq-affiliate-codex/container.env}:/workspace/.env.local:ro

  mapper-2:
    <<: *mapper
    container_name: bracketiq-affiliate-codex-agent-2
