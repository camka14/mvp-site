name: bracketiq-affiliate-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  model:
    image: ${LLAMA_CPP_IMAGE:?Set a digest-pinned LLAMA_CPP_IMAGE in deployment.env}
    restart: unless-stopped
    command:
      - --model
      - /models/${MODEL_FILE:?Set MODEL_FILE in deployment.env}
      - --alias
      - ${MODEL_ALIAS:?Set MODEL_ALIAS in deployment.env}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${MODEL_CONTEXT_SIZE:-8192}
      - --n-predict
      - ${MODEL_MAX_OUTPUT_TOKENS:-2048}
      - --parallel
      - "1"
      - --threads
      - ${MODEL_THREADS:-8}
      - --threads-batch
      - ${MODEL_THREADS_BATCH:-8}
      - --cache-type-k
      - ${MODEL_CACHE_TYPE_K:-q8_0}
      - --cache-type-v
      - ${MODEL_CACHE_TYPE_V:-q8_0}
      - --api-key-file
      - /run/secrets/model_api_key
      - --metrics
      - --offline
      - --no-webui
      - --no-slots
      - --no-agent
      - --no-context-shift
    ports:
      - "127.0.0.1:${MODEL_HOST_PORT:-8080}:8080"
    volumes:
      - ${MODEL_DIRECTORY:-/var/lib/bracketiq-ai/models}:/models:ro
    secrets:
      - model_api_key
    networks:
      - model_private
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${MODEL_MEMORY_LIMIT:-22g}
    stop_grace_period: 2m
    logging: *default-logging

  controller:
    image: ${CONTROLLER_IMAGE:?Set a digest-pinned CONTROLLER_IMAGE in deployment.env}
    profiles: ["controller"]
    env_file:
      - ${CONTROLLER_ENV_FILE:-./controller.env}
    environment:
      AFFILIATE_MAPPING_MODEL_ENDPOINT: http://model:8080
      AFFILIATE_MAPPING_MODEL_ID: ${MODEL_ALIAS:?Set MODEL_ALIAS in deployment.env}
      AFFILIATE_MAPPING_MODEL_MANIFEST: /run/config/model-manifest.json
      AFFILIATE_MAPPING_WORKTREE_PARENT: /var/lib/bracketiq-ai/worktrees
      AFFILIATE_MAPPING_BASE_COMMIT: ${CONTROLLER_BASE_COMMIT:?Set CONTROLLER_BASE_COMMIT in deployment.env}
      AFFILIATE_MAPPING_MODE: ${CONTROLLER_MODE:-disabled}
    entrypoint:
      - /workspace/deploy/ai/bin/run-controller-once.sh
    volumes:
      - ${REPOSITORY_GIT_DIRECTORY:?Set REPOSITORY_GIT_DIRECTORY in deployment.env}:/workspace/.git
      - ${AGENT_WORKTREE_DIRECTORY:-/var/lib/bracketiq-ai/worktrees}:/var/lib/bracketiq-ai/worktrees
      - ${AGENT_OUTPUT_DIRECTORY:-/var/lib/bracketiq-ai/output}:/workspace/output
      - ${MODEL_MANIFEST_FILE:?Set MODEL_MANIFEST_FILE in deployment.env}:/run/config/model-manifest.json:ro
    secrets:
      - model_api_key
    depends_on:
      - model
    networks:
      - model_private
      - controller_egress
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${CONTROLLER_MEMORY_LIMIT:-2g}
    init: true
    logging: *default-logging

networks:
  model_private:
    internal: true
  controller_egress:

secrets:
  model_api_key:
    file: ${MODEL_API_KEY_FILE:?Set MODEL_API_KEY_FILE in deployment.env}
